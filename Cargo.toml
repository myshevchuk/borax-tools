[workspace]
resolver = "3"
members = [
    "crates/borax-core",
    "crates/borax-sources",
    "crates/borax-pdf",
    "crates/borax",
]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
# How wide a question's description is drawn. Already in the tree under
# `inquire`, which draws its menus through it, so nothing new is
# compiled; only the terminal size is wanted, and the event reader and
# the rest of the terminal machinery are left off.
crossterm = { version = "0.29", default-features = false }
# The arrow-key menu a rename run asks its questions through. Only the
# crossterm backend is wanted: the date, editor and fuzzy prompts bring
# dependencies of their own and borax asks none of them.
inquire = { version = "0.9.4", default-features = false, features = [
    "crossterm",
] }
# Kept at the major/minor pdf-extract itself depends on, so both see one
# lopdf and its `Document` crosses between them.
lopdf = "0.42"
pdf-extract = "0.12"
quick-xml = "0.41"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "1"
ureq = "3"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
